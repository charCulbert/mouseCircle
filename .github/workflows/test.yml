name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# The runner has no signing certificate, so both jobs sign ad hoc.
# The sandbox entitlement still applies.

jobs:
  unit:
    name: Unit and in-app tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          xcodebuild test \
            -project "Mouse Circle.xcodeproj" -scheme "Mouse Circle" \
            -destination "platform=macOS" \
            -only-testing:"Mouse CircleTests" \
            -resultBundlePath unit.xcresult \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-results
          path: unit.xcresult

  ui:
    name: UI tests
    runs-on: macos-26
    timeout-minutes: 30
    # Menu bar clicks and global hotkeys are unproven on a hosted runner,
    # so a failure here does not fail the workflow yet.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          xcodebuild test \
            -project "Mouse Circle.xcodeproj" -scheme "Mouse Circle" \
            -destination "platform=macOS" \
            -only-testing:"Mouse CircleUITests" \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath ui.xcresult \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-results
          path: ui.xcresult
